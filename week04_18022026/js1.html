<!DOCTYPE html>
<html>
<head>
    <title>Background Color Changer</title>

    <!-- CSS -->
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
            transition: background-color 0.5s ease;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Background Color Changer</h1>
    <button id="changeColorBtn">Change Color</button>

    <!-- JavaScript -->
    <script>
        // VARIABLES
        let colors = ["red", "blue", "green", "yellow", "purple", "orange"];
        let index = 0;

        // CLASS
        class ColorChanger {
            constructor(colorArray) {
                this.colorArray = colorArray;
            }

            // FUNCTION
            getNextColor() {
                // LOOP + OPERATOR
                index = (index + 1) % this.colorArray.length;

                // CONDITION
                if (index >= this.colorArray.length) {
                    index = 0;
                }

                return this.colorArray[index];
            }
        }

        // OBJECT
        const changer = new ColorChanger(colors);

        // EVENT
        document.getElementById("changeColorBtn").addEventListener("click", function () {
            document.body.style.backgroundColor = changer.getNextColor();
        });
    </script>

</body>
</html>
