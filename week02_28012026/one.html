<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inline CSS Example</title>
</head>
<body>
  <h1 style="color: blue; font-size: 32px; text-align: center;">Welcome to My Page</h1>
  
  <p style="color: green; font-weight: bold;">This is a paragraph with inline CSS styling.</p>
  
  <div style="background-color: yellow; padding: 20px; border: 2px solid black;">
    This is a div with background color, padding, and border.
  </div>
  
  <button style="background-color: red; color: white; padding: 10px 20px; font-size: 16px; cursor: pointer;">
    Click Me
  </button>

</body>
</html>
