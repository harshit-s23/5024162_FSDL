<!DOCTYPE html>
<html>
<head>
  <title>Grid and Buttons</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
  <div class="row text-center">
    <div class="col-4 bg-primary text-white p-3">
      Column 1 <br><br>
      <button class="btn btn-light">Button</button>
    </div>

    <div class="col-4 bg-success text-white p-3">
      Column 2 <br><br>
      <button class="btn btn-dark">Button</button>
    </div>

    <div class="col-4 bg-warning p-3">
      Column 3 <br><br>
      <button class="btn btn-outline-dark">Button</button>
    </div>
  </div>
</div>

</body>
</html>
